<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Choose two contacts and reveal one</title><desc id="desc">A sample hand with two selected contact cards and the reveal choice highlighted.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18233c"/><stop offset="1" stop-color="#090f1e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/><text x="32" y="42" fill="#75f0c2" font-family="system-ui" font-size="15" font-weight="800" letter-spacing="2">YOUR TURN · BUILD AN OFFER</text><text x="32" y="72" fill="#f4f5ef" font-family="system-ui" font-size="23" font-weight="800">Choose two, then tap one to reveal</text>
  <g transform="translate(32 102)">
    <g><rect width="128" height="190" rx="18" fill="#121b30" stroke="#34425f" stroke-width="2"/><circle cx="28" cy="30" r="16" fill="#77b9ff"/><text x="28" y="36" text-anchor="middle" fill="#07121b" font-family="system-ui" font-weight="900">⌁</text><text x="16" y="68" fill="#f4f5ef" font-family="system-ui" font-size="17" font-weight="800">Analyst</text><rect x="16" y="92" width="96" height="52" rx="11" fill="#09101f" stroke="#34425f"/><text x="64" y="111" text-anchor="middle" fill="#8f9bad" font-family="system-ui" font-size="9">LANDS</text><text x="64" y="136" text-anchor="middle" fill="#77b9ff" font-family="system-ui" font-size="25" font-weight="900">6</text></g>
    <g transform="translate(144)" filter="url(#glow)"><rect width="128" height="190" rx="18" fill="#142238" stroke="#ffcf66" stroke-width="4"/><circle cx="28" cy="30" r="16" fill="#72e5bd"/><text x="28" y="36" text-anchor="middle" fill="#07140f" font-family="system-ui" font-weight="900">◈</text><text x="16" y="68" fill="#f4f5ef" font-family="system-ui" font-size="17" font-weight="800">Courier</text><rect x="16" y="92" width="96" height="52" rx="11" fill="#09101f" stroke="#72e5bd"/><text x="64" y="111" text-anchor="middle" fill="#8f9bad" font-family="system-ui" font-size="9">LANDS</text><text x="64" y="136" text-anchor="middle" fill="#72e5bd" font-family="system-ui" font-size="25" font-weight="900">4</text><rect x="44" y="161" width="68" height="21" rx="10" fill="#ffcf66"/><text x="78" y="176" text-anchor="middle" fill="#211706" font-family="system-ui" font-size="10" font-weight="900">REVEALED</text></g>
    <g transform="translate(288)" filter="url(#glow)"><rect width="128" height="190" rx="18" fill="#172039" stroke="#ffcf66" stroke-width="4"/><circle cx="28" cy="30" r="16" fill="#b19cff"/><text x="28" y="36" text-anchor="middle" fill="#17102a" font-family="system-ui" font-weight="900">◌</text><text x="16" y="68" fill="#f4f5ef" font-family="system-ui" font-size="17" font-weight="800">Ghost</text><rect x="16" y="92" width="96" height="52" rx="11" fill="#09101f" stroke="#b19cff"/><text x="64" y="111" text-anchor="middle" fill="#8f9bad" font-family="system-ui" font-size="9">LANDS</text><text x="64" y="136" text-anchor="middle" fill="#b19cff" font-family="system-ui" font-size="25" font-weight="900">3</text><rect x="50" y="161" width="62" height="21" rx="10" fill="#29344f"/><text x="81" y="176" text-anchor="middle" fill="#f4f5ef" font-family="system-ui" font-size="10" font-weight="900">SECRET</text></g>
    <g transform="translate(432)"><rect width="128" height="190" rx="18" fill="#121b30" stroke="#34425f" stroke-width="2"/><circle cx="28" cy="30" r="16" fill="#ffcb68"/><text x="28" y="36" text-anchor="middle" fill="#201506" font-family="system-ui" font-weight="900">⌘</text><text x="16" y="68" fill="#f4f5ef" font-family="system-ui" font-size="17" font-weight="800">Handler</text><rect x="16" y="92" width="96" height="52" rx="11" fill="#09101f" stroke="#34425f"/><text x="64" y="111" text-anchor="middle" fill="#8f9bad" font-family="system-ui" font-size="9">LANDS</text><text x="64" y="136" text-anchor="middle" fill="#ffcb68" font-family="system-ui" font-size="25" font-weight="900">12</text></g>
  </g><text x="320" y="334" text-anchor="middle" fill="#c2cada" font-family="system-ui" font-size="14" font-weight="700">Your rival sees Courier. Ghost stays concealed until they choose.</text>
</svg>
