<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">The twelve-space clockwise chase board</title><desc id="desc">Two agents move clockwise around a twelve-space ring, with two spaces left until interception.</desc>
  <defs><radialGradient id="bg3"><stop stop-color="#182d3c"/><stop offset="1" stop-color="#090f1e"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="640" height="360" rx="28" fill="url(#bg3)"/>
  <text x="35" y="42" fill="#75f0c2" font-family="system-ui" font-size="15" font-weight="800" letter-spacing="2">CLOCKWISE CHASE</text><text x="35" y="72" fill="#f4f5ef" font-family="system-ui" font-size="23" font-weight="800">Close the gap before they escape</text>
  <g transform="translate(320 210)"><circle r="112" fill="#0a1120" stroke="#263b4a" stroke-width="17"/><circle r="88" fill="none" stroke="#75f0c2" stroke-width="2" stroke-dasharray="5 8" opacity=".45"/>
    <g fill="#263f4b" stroke="#09111f" stroke-width="4">
      <circle cx="0" cy="-112" r="12"/><circle cx="56" cy="-97" r="12"/><circle cx="97" cy="-56" r="12"/><circle cx="112" cy="0" r="12"/><circle cx="97" cy="56" r="12"/><circle cx="56" cy="97" r="12"/><circle cx="0" cy="112" r="12"/><circle cx="-56" cy="97" r="12"/><circle cx="-97" cy="56" r="12"/><circle cx="-112" cy="0" r="12"/><circle cx="-97" cy="-56" r="12"/><circle cx="-56" cy="-97" r="12"/>
    </g><text x="0" y="-64" text-anchor="middle" fill="#75f0c2" font-family="system-ui" font-size="25" font-weight="900">↻</text><text x="0" y="7" text-anchor="middle" fill="#ffcf66" font-family="system-ui" font-size="46" font-weight="900">2</text><text x="0" y="29" text-anchor="middle" fill="#aeb9ca" font-family="system-ui" font-size="11" font-weight="800">SPACES TO CATCH</text>
    <g transform="translate(97 -56)" filter="url(#g)"><circle r="24" fill="#75f0c2" stroke="#d7fff0" stroke-width="3"/><text y="7" text-anchor="middle" fill="#07140f" font-family="system-ui" font-size="20" font-weight="900">A</text></g><g transform="translate(0 -112)" filter="url(#g)"><circle r="24" fill="#9d8cff" stroke="#ddd6ff" stroke-width="3"/><text y="7" text-anchor="middle" fill="#130d25" font-family="system-ui" font-size="20" font-weight="900">B</text></g>
  </g><g transform="translate(500 130)"><rect width="112" height="113" rx="18" fill="#25131d" stroke="#ff727c"/><text x="56" y="30" text-anchor="middle" fill="#ff9299" font-family="system-ui" font-size="11" font-weight="900">DANGER ZONE</text><text x="56" y="72" text-anchor="middle" fill="#f4f5ef" font-family="system-ui" font-size="38" font-weight="900">2</text><text x="56" y="94" text-anchor="middle" fill="#c8b4bc" font-family="system-ui" font-size="10" font-weight="700">MOVES AWAY</text></g>
  <text x="320" y="340" text-anchor="middle" fill="#c2cada" font-family="system-ui" font-size="14" font-weight="700">Both agents move on the same ring. Gain six relative spaces to intercept.</text>
</svg>
