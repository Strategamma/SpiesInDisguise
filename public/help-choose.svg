<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Choose a revealed or concealed contact</title><desc id="desc">The visible Courier card and a question-mark concealed card presented to the choosing player.</desc>
  <defs><linearGradient id="bg2" x2="1" y2="1"><stop stop-color="#1b2340"/><stop offset="1" stop-color="#090f1e"/></linearGradient><pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#151f38"/><rect x="10" width="10" height="20" fill="#202b49"/></pattern></defs>
  <rect width="640" height="360" rx="28" fill="url(#bg2)"/><text x="320" y="42" text-anchor="middle" fill="#75f0c2" font-family="system-ui" font-size="15" font-weight="800" letter-spacing="2">YOUR DECISION</text><text x="320" y="73" text-anchor="middle" fill="#f4f5ef" font-family="system-ui" font-size="23" font-weight="800">Which contact do you recruit?</text>
  <g transform="translate(146 102)"><rect width="158" height="196" rx="20" fill="#142238" stroke="#72e5bd" stroke-width="3"/><circle cx="35" cy="34" r="20" fill="#72e5bd"/><text x="35" y="41" text-anchor="middle" fill="#07140f" font-family="system-ui" font-size="20" font-weight="900">◈</text><text x="20" y="84" fill="#f4f5ef" font-family="system-ui" font-size="22" font-weight="900">Courier</text><text x="20" y="108" fill="#aeb9ca" font-family="system-ui" font-size="11" font-weight="700">KNOWN OUTCOME</text><rect x="20" y="126" width="118" height="48" rx="12" fill="#08101e" stroke="#72e5bd"/><text x="79" y="144" text-anchor="middle" fill="#8f9bad" font-family="system-ui" font-size="9">YOU LAND ON</text><text x="79" y="166" text-anchor="middle" fill="#72e5bd" font-family="system-ui" font-size="24" font-weight="900">SPACE 4</text></g>
  <g transform="translate(336 102)"><rect width="158" height="196" rx="20" fill="url(#p)" stroke="#9d8cff" stroke-width="3"/><circle cx="79" cy="65" r="31" fill="#0c1325" stroke="#75f0c2"/><text x="79" y="76" text-anchor="middle" fill="#75f0c2" font-family="system-ui" font-size="34" font-weight="900">?</text><text x="79" y="122" text-anchor="middle" fill="#f4f5ef" font-family="system-ui" font-size="21" font-weight="900">Concealed</text><text x="79" y="146" text-anchor="middle" fill="#bac4d3" font-family="system-ui" font-size="11" font-weight="700">RISK THE UNKNOWN</text><rect x="35" y="162" width="88" height="23" rx="11" fill="#75f0c2"/><text x="79" y="178" text-anchor="middle" fill="#07140f" font-family="system-ui" font-size="10" font-weight="900">TAP TO CHOOSE</text></g>
  <text x="320" y="330" text-anchor="middle" fill="#c2cada" font-family="system-ui" font-size="14" font-weight="700">You keep your choice. Your rival receives the other card.</text>
</svg>
