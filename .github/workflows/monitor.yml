name: Monitor production gateway

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Check HTTP and WebSocket health
        env:
          MONITOR_URL: https://spiesindisguise.onrender.com
          MONITOR_TIMEOUT_MS: 60000
          MAX_COLD_START_MS: 30000
        run: npm run monitor
